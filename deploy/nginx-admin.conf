# Admin nginx VM — serves admin UI + proxies admin backend API
# Replace BACKEND_VM_IP with the internal IP of your backend Docker VM.
# This VM should only be reachable from your private network / VPN.

upstream admin_backend {
    server BACKEND_VM_IP:8081;
}

server {
    listen 80;
    server_name _;

    root /var/www/admin-ui;
    index index.html;

    # Admin API routes — proxy to backend (same-origin from browser's perspective,
    # so no CORS headers are required on the Go backend)
    location /admin {
        proxy_pass         http://admin_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # React SPA — catch-all for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
