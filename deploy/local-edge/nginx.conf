# Top-level nginx config for the local prod-shaped edge stack (see
# docker-compose.local-edge.yml). This file supplies exactly what production
# gets for free from the geerlingguy.nginx role — the `upstream` blocks and
# the `server { ... }` wrapper (listen/server_name/root) — and nothing else.
# The vhost *bodies* (the location blocks with the actual routing and header
# logic) are `include`d verbatim from ../nginx/{public,admin}.conf, which
# remain the single source of truth. Do not copy those bodies here.
#
# Two ports, one nginx process: :8090 mimics the public edge, :8091 mimics
# the admin edge. Production runs these as two separate nginx hosts; locally
# one process with two server blocks is equivalent and simpler to run.
#
# LOCAL-ONLY DIFFERENCE: in production, public_backend and admin_backend point
# at two different backend containers (:8080 and :8081) because ADMIN_ENABLED
# differs per pod. Locally there is one backend process (run via run_local.sh
# / air) with ADMIN_ENABLED=true serving both route sets, so both upstreams
# below point at the same host port :8080 via host.docker.internal. This is
# intentionally not prod-shaped in that one respect — everything else (the
# vhost bodies, the Accept-based routing, the cache headers) is identical.

events {}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream public_backend {
        server host.docker.internal:8080;
    }

    upstream admin_backend {
        server host.docker.internal:8080;
    }

    # Public edge — invitee UI + public API (deploy/nginx/public.conf).
    server {
        listen 8090;
        server_name _;
        root /var/www/invitee-ui;
        index index.html;

        include /etc/nginx/party-time/public.conf;
    }

    # Admin edge — admin UI + admin API (deploy/nginx/admin.conf).
    server {
        listen 8091;
        server_name _;
        root /var/www/admin-ui;
        index index.html;

        include /etc/nginx/party-time/admin.conf;
    }
}
