# Single source of truth for the admin-edge nginx vhost body (party-time
# admin UI + admin API). Applied to production by `deploy/party-time.yml`
# (via the geerlingguy.nginx role's `nginx_vhosts[].extra_parameters` for the
# `tag_nginx_internal` play) and mounted verbatim into the local edge stack.
# These two consumers must never diverge — edit this file, not a copy.

# /healthz is registered on the public route set in main.go so it exists on
# both containers, but the admin backend is reached here through the
# /admin prefix only — /healthz does not start with /admin, so without this
# block it would fall through to `location /` and be swallowed by the SPA
# fallback (200 OK with index.html instead of JSON).
location = /healthz {
    proxy_pass         http://admin_backend;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}
location /admin {
    proxy_pass         http://admin_backend;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}
location / {
    try_files $uri $uri/ /index.html;
}
