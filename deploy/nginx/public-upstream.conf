# $public_backend for the public vhost (deploy/nginx/public.conf), dropped
# into /etc/nginx/conf.d/ on nginx-cloudflared. A conf.d file survives
# homelab's site.yml rewriting nginx.conf on every baseline run.
#
# The vhost does `proxy_pass $public_backend`. With a variable, nginx looks
# the name up per request (re-checked every `valid=` seconds) through the
# `resolver` that homelab's site.yml installs on every nginx host
# (/etc/nginx/conf.d/resolver.conf -> systemd-resolved -> router dnsmasq for
# home.arpa). A static `upstream { server docker.home.arpa:8080; }` block is
# resolved once at startup instead, and nginx refuses to start at all if the
# name doesn't resolve yet: that kept the public site down for 3 days after
# an Oct 23 reboot. Don't go back to an upstream block, and don't pin the IP:
# services address each other by home.arpa name.
map $host $public_backend {
    default http://docker.home.arpa:8080;
}
