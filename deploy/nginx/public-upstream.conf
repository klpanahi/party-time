# public_backend upstream, dropped into /etc/nginx/conf.d/ (not templated
# into nginx.conf via the geerlingguy.nginx role's nginx_upstreams var)
# because homelab's site.yml rewrites nginx.conf on every baseline run
# without knowing about party-time's upstreams. A conf.d file survives that
# rewrite; an nginx_upstreams-templated block does not, and leaves
# party-time-public.conf's proxy_pass pointing at an upstream that no
# longer exists ("host not found in upstream" -> nginx -t fails -> site.yml
# refuses to apply its own config).
upstream public_backend {
    server docker.local:8080;
}
