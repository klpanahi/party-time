# Public nginx VM — serves invitee UI + proxies public backend API
# Replace BACKEND_VM_IP with the internal IP of your backend Docker VM.

upstream public_backend {
    server BACKEND_VM_IP:8080;
}

server {
    listen 80;
    server_name _;

    root /var/www/invitee-ui;
    index index.html;

    # Public API routes — proxy to backend
    location ~ ^/(invite|event|invites) {
        proxy_pass         http://public_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # React SPA — catch-all for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
