services:
  postgres-db:
    image: postgres:17
    container_name: party-time-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DBUSER:-myuser}
      POSTGRES_PASSWORD: ${DBPASS:-mypassword}
      POSTGRES_DB: party_time
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DBUSER:-myuser}"]
      interval: 5s
      timeout: 5s
      retries: 10

  public-backend:
    build: ./public_backend
    image: party-time-backend:latest
    container_name: party-time-public
    restart: unless-stopped
    env_file: .env.prod
    environment:
      ADMIN_ENABLED: "false"
      DBHOST: postgres-db
      DBPORT: "5432"
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy

  admin-backend:
    image: party-time-backend:latest
    container_name: party-time-admin
    restart: unless-stopped
    env_file: .env.prod
    environment:
      ADMIN_ENABLED: "true"
      DBHOST: postgres-db
      DBPORT: "5432"
    ports:
      - "8081:8080"
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  pgdata:
