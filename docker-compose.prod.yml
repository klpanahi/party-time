services:
  postgres-db:
    image: postgres:17
    container_name: party-time-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DBUSER:-myuser}
      POSTGRES_PASSWORD: ${DBPASS:-mypassword}
      POSTGRES_DB: party_time
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DBUSER:-myuser}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot goose migration runner. Applies embedded migrations
  # (public_backend/migrations/*.sql) against postgres-db and exits.
  # public-backend/admin-backend depend on this completing successfully so
  # the two backends can never race into the migrator concurrently.
  migrate:
    image: ${PARTY_TIME_IMAGE:-party-time-backend:latest}
    container_name: party-time-migrate
    command: ["./server", "migrate", "up"]
    env_file: .env.prod
    environment:
      DBHOST: postgres-db
      DBPORT: "5432"
    restart: "no"
    depends_on:
      postgres-db:
        condition: service_healthy

  public-backend:
    build: ./public_backend
    image: ${PARTY_TIME_IMAGE:-party-time-backend:latest}
    container_name: party-time-public
    restart: unless-stopped
    env_file: .env.prod
    environment:
      ADMIN_ENABLED: "false"
      DBHOST: postgres-db
      DBPORT: "5432"
      # From the deploy playbook's own .env (see deploy/party-time.yml), not
      # .env.prod — this overrides anything of the same name .env.prod might
      # carry, and :? refuses to start rather than silently falling back to
      # the http://localhost:5174 default baked into the binary.
      INVITEE_BASE_URL: ${INVITEE_BASE_URL:?INVITEE_BASE_URL not set — see deploy/hosts.env}
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  admin-backend:
    image: ${PARTY_TIME_IMAGE:-party-time-backend:latest}
    container_name: party-time-admin
    restart: unless-stopped
    env_file: .env.prod
    environment:
      ADMIN_ENABLED: "true"
      DBHOST: postgres-db
      DBPORT: "5432"
      # See the same var on public-backend above — the admin container needs
      # it too, since adminGetEvent/adminLaunchEvent/adminSendMessage build
      # every invite_url and SMS body from it.
      INVITEE_BASE_URL: ${INVITEE_BASE_URL:?INVITEE_BASE_URL not set — see deploy/hosts.env}
    ports:
      - "8081:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
